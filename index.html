<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tobs CC - Batting Analytics Dashboard</title>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: #0b1120; 
    color: #f8fafc;
    padding: 24px; 
    margin: 0;
  }
  .dashboard-layout {
    display: flex;
    max-width: 1260px;
    margin: 0 auto;
    gap: 24px;
    align-items: flex-start;
  }
  
  /* Sidebar for Match Filters */
  .sidebar {
    width: 320px;
    background: #1e293b;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    border: 1px solid #334155;
    flex-shrink: 0;
  }
  .sidebar h3 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 16px;
    color: #38bdf8;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .filter-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .filter-btn {
    background: #0f172a;
    color: #94a3b8;
    border: 1px solid #475569;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .filter-btn:hover {
    color: #fff;
    border-color: #38bdf8;
  }
  .match-list {
    max-height: 580px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 4px;
  }
  .match-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #0f172a;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .match-item:hover {
    border-color: #38bdf8;
  }
  .match-item.did-not-bat {
    opacity: 0.55;
  }
  .match-item input[type="checkbox"] {
    accent-color: #0284c7;
    width: 16px;
    height: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .match-label-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    overflow: hidden;
    gap: 8px;
  }
  .match-name-text {
    font-size: 13px;
    font-weight: 500;
    color: #e2e8f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .match-runs-badge {
    font-size: 12px;
    font-weight: 700;
    color: #38bdf8;
    white-space: nowrap;
  }
  .match-runs-badge.no-runs {
    color: #64748b;
    font-weight: 500;
  }
  
  /* Main Content Area */
  .main-card { 
    flex: 1;
    background: #1e293b; 
    padding: 26px 30px; 
    border-radius: 14px; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
    border: 1px solid #334155;
    text-align: center;
  }
  h2 { margin-top: 0; color: #38bdf8; letter-spacing: -0.5px; }
  
  .controls-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  select { 
    font-size: 15px; 
    padding: 9px 18px; 
    border-radius: 8px; 
    background: #0f172a; 
    color: #fff; 
    border: 1px solid #475569; 
    font-weight: bold; 
    outline: none;
    cursor: pointer;
  }
  
  /* Toggle Switch */
  .view-toggle {
    display: inline-flex;
    background: #0f172a;
    border-radius: 8px;
    padding: 4px;
    border: 1px solid #475569;
  }
  .toggle-btn {
    padding: 7px 18px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s ease;
  }
  .toggle-btn.active {
    background: #0284c7;
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .metric-cards {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 20px;
  }
  .metric-box {
    background: #0f172a;
    padding: 12px 16px;
    border-radius: 10px;
    flex: 1;
    border: 1px solid #334155;
  }
  .metric-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 3px; }
  .metric-val { font-size: 22px; font-weight: bold; color: #38bdf8; }
  
  .visual-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    margin: 10px 0 16px;
  }
  svg.ground {
    background: #091322;
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
  }
  .zone-sector {
    transition: fill 0.3s ease, stroke-width 0.2s ease;
    cursor: pointer;
  }
  .zone-sector:hover {
    stroke: #38bdf8;
    stroke-width: 3px;
  }

  .wagon-legend {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 12px;
    font-size: 13px;
    font-weight: bold;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
  
  table.zone-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background: #0f172a;
    border-radius: 8px;
    overflow: hidden;
    font-size: 14px;
    border: 1px solid #334155;
  }
  table.zone-table th, table.zone-table td {
    padding: 9px 12px;
    text-align: right;
  }
  table.zone-table th:first-child, table.zone-table td:first-child {
    text-align: left;
  }
  table.zone-table th {
    background: #1e293b;
    color: #94a3b8;
    font-weight: 600;
  }
  table.zone-table tr:not(:last-child) td {
    border-bottom: 1px solid #1e293b;
  }
  table.zone-table tr.total-row {
    background: #172554;
    font-weight: bold;
    color: #38bdf8;
  }
</style>
</head>
<body>

<div class="dashboard-layout">
  
  <!-- Matches Checkbox Sidebar -->
  <div class="sidebar">
    <h3>Matches Filter</h3>
    <div class="filter-actions">
      <button class="filter-btn" onclick="toggleAllMatches(true)">Select All</button>
      <button class="filter-btn" onclick="toggleAllMatches(false)">Clear All</button>
    </div>
    <div class="match-list" id="matchList"></div>
  </div>

  <!-- Main Visual Card -->
  <div class="main-card">
    <h2>🏏 Tobs CC - Season Batting Analytics</h2>
    
    <div class="controls-row">
      <select id="playerSelect" onchange="onPlayerChange()">
        <option value="AHD">AHD (1 balls)</option><option value="Beads">Beads (121 balls)</option><option value="Chaz">Chaz (32 balls)</option><option value="Fish">Fish (16 balls)</option><option value="Fowles">Fowles (54 balls)</option><option value="Hastings">Hastings (35 balls)</option><option value="JB">JB (29 balls)</option><option value="James">James (10 balls)</option><option value="Jon">Jon (115 balls)</option><option value="Keith">Keith (65 balls)</option><option value="Lloyd">Lloyd (1 balls)</option><option value="Matt">Matt (11 balls)</option><option value="Player">Player (10 balls)</option><option value="Sloan">Sloan (2 balls)</option><option value="Tim">Tim (32 balls)</option>
      </select>

      <div class="view-toggle">
        <button class="toggle-btn active" id="btnWagon" onclick="switchView('wagon')">Wagon Wheel</button>
        <button class="toggle-btn" id="btnZones" onclick="switchView('zones')">Scoring Areas</button>
      </div>
    </div>

    <div class="metric-cards">
      <div class="metric-box"><div class="metric-title">Runs</div><div class="metric-val" id="totalRuns">0</div></div>
      <div class="metric-box"><div class="metric-title">Balls</div><div class="metric-val" id="totalBalls">0</div></div>
      <div class="metric-box"><div class="metric-title">Boundaries (4s / 6s)</div><div class="metric-val" id="totalBoundaries">0 / 0</div></div>
      <div class="metric-box"><div class="metric-title">Top Scoring Zone</div><div class="metric-val" id="topZone">-</div></div>
    </div>

    <div class="visual-wrapper">
      <svg width="540" height="540" viewBox="0 0 560 560" class="ground" id="mainSvg">
        <!-- Ground Perimeter Circle (Radius 230) -->
        <circle cx="280" cy="250" r="230" fill="#091322" stroke="#334155" stroke-width="2"/>

        <!-- Sectors Layer (for scoring zones) -->
        <g id="sectorsGroup"></g>
        
        <!-- Inner 30-yard ring -->
        <circle cx="280" cy="250" r="140" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.6"/>
        
        <!-- Pitch Rectangle -->
        <rect x="268" y="245" width="24" height="105" fill="#f8fafc" stroke="#94a3b8" rx="2"/>
        <!-- Batting Crease -->
        <line x1="262" y1="250" x2="298" y2="250" stroke="#ef4444" stroke-width="2.5"/>
        <circle cx="280" cy="250" r="4.5" fill="#0f172a"/>
        
        <!-- Off Side & Leg Side Headers with clear pill backgrounds -->
        <g id="headerLabels">
          <rect x="75" y="38" width="95" height="24" rx="12" fill="#1e293b" stroke="#334155" opacity="0.95"/>
          <text x="122.5" y="54" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="0.5" text-anchor="middle">OFF SIDE</text>

          <rect x="390" y="38" width="95" height="24" rx="12" fill="#1e293b" stroke="#334155" opacity="0.95"/>
          <text x="437.5" y="54" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="0.5" text-anchor="middle">LEG SIDE</text>

          <text x="280" y="542" fill="#64748b" font-size="11" font-weight="700" letter-spacing="0.5" text-anchor="middle">BOWLER'S END (DOWN THE GROUND)</text>
        </g>
        
        <!-- Dynamic Wagon Rays Layer -->
        <g id="shotLinesGroup"></g>

        <!-- Text Callouts Layer -->
        <g id="labelsGroup"></g>
      </svg>
    </div>

    <!-- Legend for Wagon Wheel -->
    <div class="wagon-legend" id="wagonLegend">
      <div class="legend-item"><span class="dot" style="background:#00A896"></span> 1 Run</div>
      <div class="legend-item"><span class="dot" style="background:#F4A261"></span> 2 Runs</div>
      <div class="legend-item"><span class="dot" style="background:#E76F51"></span> 3 Runs</div>
      <div class="legend-item"><span class="dot" style="background:#7B1FA2"></span> 4 Runs</div>
      <div class="legend-item"><span class="dot" style="background:#1565C0"></span> 6 Runs</div>
    </div>

    <!-- Table for Scoring Areas -->
    <table class="zone-table" id="zonesTable" style="display: none;">
      <thead>
        <tr>
          <th>Fielding Zone</th>
          <th>Shots</th>
          <th>Runs</th>
          <th>4s</th>
          <th>6s</th>
          <th>% of Total Runs</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

const ZONES = [{"name": "Third Man", "start": 300.0, "end": 345.0, "mid": 322.5}, {"name": "Fine Leg", "start": 15.0, "end": 60.0, "mid": 37.5}, {"name": "Point", "start": 255.0, "end": 300.0, "mid": 277.5}, {"name": "Square Leg", "start": 60.0, "end": 105.0, "mid": 82.5}, {"name": "Cover / Extra Cover", "start": 210.0, "end": 255.0, "mid": 232.5}, {"name": "Mid-Wicket", "start": 105.0, "end": 150.0, "mid": 127.5}, {"name": "Long Off / Mid-Off", "start": 180.0, "end": 210.0, "mid": 195.0}, {"name": "Long On / Mid-On", "start": 150.0, "end": 180.0, "mid": 165.0}];

const ALL_MATCHES = ["BAL 30th apr", "BAL 8 jul", "Kenton 20th may", "Kenton 3rd aug", "Old imp 29th may", "Snakes 16 jul", "phins cup", "stokr 15 june", "strictly 14th aug", "strictly 309th"];

let currentView = 'wagon';
let activeMatches = new Set(ALL_MATCHES);

// Canvas Center and Boundary Radius
const CX = 280;
const CY = 250;
const RADIUS = 230; // Exact boundary rope
const MAX_NON_BOUNDARY_RADIUS = RADIUS * 0.95; // Capped 5% below boundary (218.5)

function updateMatchCheckboxes() {
  const playerName = document.getElementById("playerSelect").value;
  const playerShots = DATA[playerName] || [];

  const statsByMatch = {};
  ALL_MATCHES.forEach(m => {
    statsByMatch[m] = { runs: 0, balls: 0 };
  });

  playerShots.forEach(s => {
    const m = s.match_label;
    if (statsByMatch[m]) {
      statsByMatch[m].runs += parseInt(s.runs, 10) || 0;
      statsByMatch[m].balls += 1;
    }
  });

  const container = document.getElementById("matchList");
  container.innerHTML = "";

  ALL_MATCHES.forEach(m => {
    const item = document.createElement("label");
    const st = statsByMatch[m];
    const didBat = st.balls > 0;
    
    item.className = didBat ? "match-item" : "match-item did-not-bat";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = m;
    cb.checked = activeMatches.has(m);
    cb.onchange = () => {
      if (cb.checked) activeMatches.add(m);
      else activeMatches.delete(m);
      renderActiveView();
    };

    const textWrap = document.createElement("div");
    textWrap.className = "match-label-container";

    const nameSpan = document.createElement("span");
    nameSpan.className = "match-name-text";
    nameSpan.innerText = m;

    const runsSpan = document.createElement("span");
    if (didBat) {
      runsSpan.className = "match-runs-badge";
      runsSpan.innerText = `(${st.runs} runs, ${st.balls}b)`;
    } else {
      runsSpan.className = "match-runs-badge no-runs";
      runsSpan.innerText = `(0 runs)`;
    }

    textWrap.appendChild(nameSpan);
    textWrap.appendChild(runsSpan);

    item.appendChild(cb);
    item.appendChild(textWrap);
    container.appendChild(item);
  });
}

function onPlayerChange() {
  updateMatchCheckboxes();
  renderActiveView();
}

function toggleAllMatches(select) {
  activeMatches.clear();
  if (select) ALL_MATCHES.forEach(m => activeMatches.add(m));
  
  document.querySelectorAll("#matchList input[type='checkbox']").forEach(cb => {
    cb.checked = select;
  });
  renderActiveView();
}

function polarToCartesian(angleDeg, r) {
  const rad = ((angleDeg - 90) * Math.PI) / 180.0;
  return {
    x: CX + (r * Math.cos(rad)),
    y: CY + (r * Math.sin(rad))
  };
}

function describeArc(startAngle, endAngle, r) {
  let sweep = endAngle - startAngle;
  if (sweep < 0) sweep += 360;

  const start = polarToCartesian(startAngle, r);
  const end = polarToCartesian(endAngle, r);
  const largeArcFlag = sweep <= 180 ? "0" : "1";

  return [
    "M", CX, CY,
    "L", start.x, start.y,
    "A", r, r, 0, largeArcFlag, 1, end.x, end.y,
    "Z"
  ].join(" ");
}

function switchView(view) {
  currentView = view;
  document.getElementById('btnWagon').classList.toggle('active', view === 'wagon');
  document.getElementById('btnZones').classList.toggle('active', view === 'zones');
  
  document.getElementById('wagonLegend').style.display = view === 'wagon' ? 'flex' : 'none';
  document.getElementById('zonesTable').style.display = view === 'zones' ? 'table' : 'none';

  renderActiveView();
}

function renderActiveView() {
  const playerName = document.getElementById("playerSelect").value;
  const rawDeliveries = DATA[playerName] || [];

  const deliveries = rawDeliveries.filter(d => activeMatches.has(d.match_label));

  let grandRuns = 0;
  let grandFours = 0;
  let grandSixes = 0;
  const zoneStats = {};
  ZONES.forEach(z => zoneStats[z.name] = { shots: 0, runs: 0, fours: 0, sixes: 0, config: z });

  deliveries.forEach(d => {
    const r = parseInt(d.runs, 10) || 0;
    grandRuns += r;
    if (r === 4) grandFours++;
    if (r === 6) grandSixes++;

    if (zoneStats[d.zone_name]) {
      zoneStats[d.zone_name].shots++;
      zoneStats[d.zone_name].runs += r;
      if (r === 4) zoneStats[d.zone_name].fours++;
      if (r === 6) zoneStats[d.zone_name].sixes++;
    }
  });

  document.getElementById("totalRuns").innerText = grandRuns;
  document.getElementById("totalBalls").innerText = deliveries.length;
  document.getElementById("totalBoundaries").innerText = `${grandFours} / ${grandSixes}`;

  let maxZoneRuns = -1;
  let bestZoneName = "-";
  Object.keys(zoneStats).forEach(k => {
    if (zoneStats[k].runs > maxZoneRuns) {
      maxZoneRuns = zoneStats[k].runs;
      bestZoneName = k;
    }
  });
  document.getElementById("topZone").innerText = grandRuns > 0 ? bestZoneName : "-";

  const sectorsGroup = document.getElementById("sectorsGroup");
  const shotLinesGroup = document.getElementById("shotLinesGroup");
  const labelsGroup = document.getElementById("labelsGroup");
  sectorsGroup.innerHTML = "";
  shotLinesGroup.innerHTML = "";
  labelsGroup.innerHTML = "";

  if (currentView === 'wagon') {
    deliveries.forEach(s => {
      const runs = String(s.runs || "0");
      const rInt = parseInt(runs, 10) || 0;

      // Extract raw delta from pitch crease (249.72, 208.74)
      const origX = parseFloat(s.end_x);
      const origY = parseFloat(s.end_y);

      if (!isNaN(origX) && !isNaN(origY)) {
        const dx = origX - 249.71765;
        const dy = origY - 208.74;
        const rawDist = Math.hypot(dx, dy);

        let finalDist;
        if (rInt === 4 || rInt === 6) {
          // 4s and 6s project directly to the boundary edge
          finalDist = RADIUS;
        } else {
          // Lower scoring shots maintain natural distance, capped at 5% below boundary
          finalDist = Math.min(rawDist, MAX_NON_BOUNDARY_RADIUS);
        }

        // Scale coordinates along the exact delivery ray direction
        const angle = Math.atan2(dy, dx);
        const x2 = CX + finalDist * Math.cos(angle);
        const y2 = CY + finalDist * Math.sin(angle);
        const col = COLOR_MAP[runs] || "#64748b";

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", CX);
        line.setAttribute("y1", CY);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
        line.setAttribute("stroke", col);
        line.setAttribute("stroke-width", rInt >= 4 ? "2.5" : "1.8");
        line.setAttribute("stroke-linecap", "round");
        line.setAttribute("opacity", "0.85");
        shotLinesGroup.appendChild(line);

        const circ = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circ.setAttribute("cx", x2);
        circ.setAttribute("cy", y2);
        circ.setAttribute("r", rInt >= 4 ? "3.5" : "2.5");
        circ.setAttribute("fill", col);
        shotLinesGroup.appendChild(circ);
      }
    });

  } else {
    const tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "";

    const displayOrder = [
      "Long Off / Mid-Off", "Long On / Mid-On", 
      "Cover / Extra Cover", "Mid-Wicket", 
      "Point", "Square Leg", 
      "Third Man", "Fine Leg"
    ];

    ZONES.forEach(z => {
      const s = zoneStats[z.name];
      const runShare = grandRuns > 0 ? (s.runs / grandRuns) : 0;
      
      let fillColor = "rgba(15, 23, 42, 0.4)";
      if (runShare > 0.25) fillColor = "rgba(56, 189, 248, 0.55)";
      else if (runShare > 0.15) fillColor = "rgba(56, 189, 248, 0.35)";
      else if (runShare > 0.05) fillColor = "rgba(56, 189, 248, 0.20)";
      else if (s.shots > 0) fillColor = "rgba(148, 163, 184, 0.15)";

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", describeArc(z.start, z.end, RADIUS));
      path.setAttribute("fill", fillColor);
      path.setAttribute("stroke", "#334155");
      path.setAttribute("stroke-width", "1.5");
      path.setAttribute("class", "zone-sector");
      sectorsGroup.appendChild(path);

      const labelPos = polarToCartesian(z.mid, RADIUS * 0.72);
      
      const textTitle = document.createElementNS("http://www.w3.org/2000/svg", "text");
      textTitle.setAttribute("x", labelPos.x);
      textTitle.setAttribute("y", labelPos.y - 10);
      textTitle.setAttribute("fill", "#94a3b8");
      textTitle.setAttribute("font-size", "11px");
      textTitle.setAttribute("font-weight", "600");
      textTitle.setAttribute("text-anchor", "middle");
      textTitle.textContent = z.name.split("/")[0].trim();
      labelsGroup.appendChild(textTitle);

      const textVal = document.createElementNS("http://www.w3.org/2000/svg", "text");
      textVal.setAttribute("x", labelPos.x);
      textVal.setAttribute("y", labelPos.y + 8);
      textVal.setAttribute("fill", s.runs > 0 ? "#38bdf8" : "#64748b");
      textVal.setAttribute("font-size", "13px");
      textVal.setAttribute("font-weight", "bold");
      textVal.setAttribute("text-anchor", "middle");
      textVal.textContent = `${s.runs} (${s.shots}b)`;
      labelsGroup.appendChild(textVal);
    });

    displayOrder.forEach(name => {
      const s = zoneStats[name];
      if (!s) return;
      const runShare = grandRuns > 0 ? (s.runs / grandRuns) : 0;
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${name}</td>
        <td>${s.shots}</td>
        <td><strong>${s.runs}</strong></td>
        <td>${s.fours}</td>
        <td>${s.sixes}</td>
        <td>${(runShare * 100).toFixed(1)}%</td>
      `;
      tableBody.appendChild(row);
    });

    const totalRow = document.createElement("tr");
    totalRow.className = "total-row";
    totalRow.innerHTML = `
      <td>Total</td>
      <td>${deliveries.length}</td>
      <td>${grandRuns}</td>
      <td>${grandFours}</td>
      <td>${grandSixes}</td>
      <td>100.0%</td>
    `;
    tableBody.appendChild(totalRow);
  }
}

// Initialize
updateMatchCheckboxes();
renderActiveView();
</script>
</body>
</html>
